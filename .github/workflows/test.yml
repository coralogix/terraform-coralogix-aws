name: Terraform testing

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "modules/**"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-changed-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Get changed packages
        id: get-changed-packages
        run: |
          set -euo pipefail
          PACKAGES=$(
            git diff --name-only --diff-filter=d \
              "${{ github.event.pull_request.base.sha || 'origin/master' }}" "${{ github.sha }}" -- modules/ \
              | xargs -r -n1 dirname \
              | sed -r 's|modules/([^/]+).*$|modules/\1|g' \
              | xargs -r -n1 basename \
              | sort -u \
              | jq -rcnR '[inputs]'
          )
          if [[ "$PACKAGES" == "[]" ]]; then
            echo "No changed modules under modules/; refusing empty matrix." >&2
            exit 1
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.packages) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
  
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - if: ${{ matrix.package == 'coralogix-aws-shipper' }}
        name: Terraform native tests
        run: |
          cd "modules/${{ matrix.package }}"
          terraform init -backend=false
          terraform test
          
      - name: Check for missing test directories
        run: |
          chmod +x tests/compare_directories_test.sh
          output=$(tests/compare_directories_test.sh)
          # Check if the output is empty
          if [ -z "$output" ] || [[ "$output" == "locals_variables" ]] ; then
            echo "[INFO] No tests are missing for Terraform module ${{ matrix.package }}."
          else
            echo "$output"
            exit 1
          fi
          
      - name: Compare variables in test file and in the module
        run: |
          if [[ ${{ matrix.package }} != "locals_variables" ]]; then
            chmod +x tests/test_variables_script.sh
            output=$(tests/test_variables_script.sh modules/${{ matrix.package }}/variables.tf tests/${{ matrix.package }}/${{ matrix.package }}.tf)
            # Check if the output is empty
            if [ -z "$output" ]; then
              echo "[INFO] Test file for module ${{ matrix.package }} is currect."
            else
              echo "[ERROR] This variables are missing in the module test file: $output"
              exit 1
            fi
          fi
        
      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::035955823196:role/github-actions-terraform-coralogix-aws-test
          aws-region: us-east-1

      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }} 
        name: Terraform fmt check
        run: |
          if [[ ${{ matrix.package }} != "locals_variables" ]];then
            cd "modules/${{ matrix.package }}"
            terraform fmt -check -recursive
          fi
          
      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }} 
        name: Terraform init
        run: |
          if [[ ${{ matrix.package }} != "locals_variables" ]];then
            cd "tests/${{ matrix.package }}"
            terraform init
          fi
          
      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }} 
        name: Terraform validate
        run: |
          if [[ ${{ matrix.package }} != "locals_variables" ]];then
            cd "tests/${{ matrix.package }}"
            terraform validate
          fi
      
      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        name: Terraform plan
        run:  |
          if [[ ${{ matrix.package }} != "locals_variables" ]];then
            cd "tests/${{ matrix.package }}"
            terraform plan -parallelism=1
          fi

      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository && matrix.package == 'ecs-ec2' }}
        name: Verify service-only mode (no task def / IAM creates)
        run: |
          cd "tests/ecs-ec2"
          chmod +x verify-service-only-mode.sh
          ./verify-service-only-mode.sh

      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository && matrix.package == 'ecs-ec2' }}
        name: Verify supervised mode configs and permissions
        run: |
          cd "tests/ecs-ec2"
          chmod +x verify-supervised-mode.sh
          ./verify-supervised-mode.sh

      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository && matrix.package == 'ecs-ec2' }}
        name: Verify profiling mode configs and permissions
        run: |
          cd "tests/ecs-ec2"
          chmod +x verify-profiling-mode.sh
          ./verify-profiling-mode.sh
